# A review stop: the operator standing in the middle of a pipeline.
#
# Researcher works, you read what it handed over and say what happens next, Writer acts on your
# answer. The `review` node is an `agents[]` entry like any other — it has an id, it sits on edges,
# it takes part in the topological order — except that instead of a model it has a question, which
# is its `role`, and that is what the panel shows when the pipeline reaches it.
#
# Both agents run on `fake/offline`, LoomWatch's offline demo model, so the example runs with no
# key and calls no provider: each says one line of text, then answers send-back, handover and
# checkpoint turns. Give them an OpenRouter model (see examples/research-team.yaml) when you want
# them to do real work. See docs/TEAM_CONFIG.md, "Operator review stops and questions", and
# docs/WATCH.md, "Verifying without a model provider".
schemaVersion: 1
id: operator-stop
name: Review stop demo
# What one run may spend on model calls, in US dollars (ADR 0068). The offline demo costs nothing;
# the limit is there for when you give the agents a real model.
spend:
  perRun: 1.00
entrypoint: researcher

agents:
  - id: researcher
    name: Researcher
    role: Find out what is true and hand it over.
    model: fake/offline

  # The stop. No model: there is nothing to start and no model to select. `name` defaults to
  # "You" if you leave it out.
  - id: review
    kind: operator
    name: You
    role: Researcher is done. Approve the findings, or say what to change.

  - id: writer
    name: Writer
    role: Write the answer the operator asked for.
    model: fake/offline

edges:
  - from: researcher
    to: review
    layer: configured
    kind: sequence
    ts: "2026-09-13T00:00:00Z"
  - from: review
    to: writer
    layer: configured
    kind: sequence
    ts: "2026-09-13T00:00:00Z"
