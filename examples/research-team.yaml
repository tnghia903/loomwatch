# A research pipeline on LoomWatch's own agent: the researcher gathers on a faster model and may
# bring in helpers, the reviewer checks what it found on the strongest one. Each `model` is an
# OpenRouter model id; with your OpenRouter key added in LoomWatch, the team runs as it is.
schemaVersion: 1
id: research-team
name: Research and review
entrypoint: researcher
guards:
  maxDispatchDepth: 4
  maxConcurrentDispatches: 4
agents:
  - id: researcher
    name: Researcher
    role: Research the question and report what you find, with a source for each finding
    model: anthropic/claude-sonnet-5.5
    allow:
      web: true
    allowRecruiting: true
  - id: reviewer
    name: Reviewer
    role: Review the research findings and say which of them hold up
    model: anthropic/claude-opus-5.5
    allow:
      web: true
    allowRecruiting: false
edges:
  - from: researcher
    to: reviewer
    layer: configured
    kind: sequence
    ts: "2026-09-05T00:00:00Z"
