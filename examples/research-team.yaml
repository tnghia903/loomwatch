schemaVersion: 1
id: research-team
name: Research and review
entrypoint: researcher
agents:
  - id: researcher
    name: Protocol Researcher
    role: Research ACP behavior
    spawn:
      cmd: opencode
      args:
        - acp
      env: {}
      cwd: .
    model: kimi-for-coding/k3-256k
    budget:
      limitUsd: 5
      warnAtPercent: 80
    status: idle
  - id: reviewer
    name: Code Reviewer
    role: Review research findings
    spawn:
      cmd: claude-agent-acp
      args: []
      env: {}
      cwd: .
    model: claude-opus-5
    budget:
      limitUsd: 5
    status: idle
edges:
  - from: researcher
    to: reviewer
    layer: configured
    kind: sequence
    ts: "2026-09-05T00:00:00Z"
