[package]
name = "loomwatch-backend"
version = "0.1.0"
description = "Local execution backend for LoomWatch"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "loomwatchd"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
mime_guess = "2.0"
rust-embed = "8.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
serde_yaml = "0.9.34"
sqlx = { version = "0.8.6", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio-rustls"] }
tokio = { version = "1.47", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.18", features = ["v4"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
cron = "0.17"
chrono-tz = "0.10"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
futures-util = "0.3"
tokio-tungstenite = "0.29"
http-body-util = "0.1"
jsonschema = { version = "0.53.0", default-features = false }
tower = { version = "0.5", features = ["util"] }
url = "2.5"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
