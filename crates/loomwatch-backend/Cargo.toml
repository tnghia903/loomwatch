[package]
name = "loomwatch-backend"
version = "0.21.0"
description = "Local execution backend for LoomWatch"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "loomwatchd"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["chatgpt"]
# Agents may run on the person's ChatGPT plan (ADR 0073). A paid build ships without it until
# OpenAI approves one.
chatgpt = []
# The quality bench's developer build: every fixed text agents are given can be replaced by a file
# (src/prompt_blocks, `LOOMWATCH_PROMPT_OVERRIDES`, `--dump-prompt-blocks`). Never in a release, a
# package, or any CI job but the one that tests it.
prompt-overrides = []

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
mime_guess = "2.0"
rust-embed = "8.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
# Notion sign-in: PKCE challenges, form bodies and the consent-page address.
base64 = "0.22"
url = "2.5"
serde_yaml = "0.9.34"
# The archive is one SQLite file, built into the program.
sqlx = { version = "0.8.6", default-features = false, features = ["json", "macros", "migrate", "runtime-tokio-rustls", "sqlite"] }
regex = "1.11"
# Chat search reads words without their accents (chat_find.rs).
unicode-normalization = "0.1"
# The archive keeps raw ACP frames compressed (archive/codec.rs).
zstd = { version = "0.13", default-features = false }
tokio = { version = "1.47", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
# Skills installed from GitHub arrive as a .tar.gz (marketplace.rs).
flate2 = "1.1"
tar = "0.4"
# Skills installed from ClawHub arrive as a ZIP (marketplace.rs). Reading only: deflate through
# the flate2 above, nothing else.
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2"] }
uuid = { version = "1.18", features = ["v4", "v7"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
cron = "0.17"
chrono-tz = "0.10"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
# Ask LoomWatch checks a proposed team against the same schema the editor enforces before saving.
jsonschema = { version = "0.58.2", default-features = false }
# Resolved paths without Windows' `\\?\` prefix, which cmd.exe refuses as a working folder and
# which never compares equal to a path the operator typed. On other systems it is std's own
# `canonicalize`.
dunce = "1.0"
# A skills search reads its results' licenses a few at a time (marketplace.rs). Already in the
# build through axum and sqlx.
futures-util = "0.3"
# Tools the operator connects (connected_tools/): the official MCP client, over Streamable HTTP with sign-in.
# TLS is reqwest's rustls above; rmcp adds no TLS of its own.
rmcp = { version = "3.5", default-features = false, features = ["auth", "client", "transport-streamable-http-client-reqwest"] }
# rmcp's credential store is an async_trait trait.
async-trait = "0.1"
# Agents read the files people have (documents.rs): a PDF's text, Excel workbooks, and Word and
# PowerPoint files, which are ZIPs of XML read with the zip above. Pictures are shrunk only when
# larger than a model takes them, in the four formats every provider accepts.
pdf-extract = "0.12.1"
calamine = { version = "0.37", default-features = false }
quick-xml = "0.42"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Email files (`.eml`, as Mail hands over a message dragged out of it; documents/email.rs): headers,
# bodies in any transfer encoding and charset, and HTML-only mail as text. `full_encoding` adds the
# Asian charsets through encoding_rs, already in the build through calamine and lopdf.
mail-parser = { version = "0.11.9", features = ["full_encoding"] }
# The door other devices come in by (ADR 0102): their keys, and a computer's live connections passed
# through as they are.
getrandom = "0.3"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
# A phone's answers, compressed for mobile data.
tower-http = { version = "0.6", features = ["compression-gzip"] }
# A pairing link as a QR code, for a phone's camera.
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
http-body-util = "0.1"
tokio-tungstenite = "0.29"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
# The OpenRouter key and the Notion connection, in Windows Credential Manager.
keyring = { version = "3", default-features = false, features = ["windows-native"] }
# Ends a command's whole process tree with it: Windows has no process groups.
win32job = "2.0"
