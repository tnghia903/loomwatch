[package]
name = "loomwatch-backend"
version = "0.1.0"
description = "Local execution backend for LoomWatch"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "loomwatchd"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.34"
sqlx = { version = "0.8.6", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio-rustls"] }
tokio = { version = "1.47", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
jsonschema = { version = "0.53.0", default-features = false }
url = "2.5"
