[package]
name = "loomwatch-app"
version = "0.5.0"
description = "LoomWatch.app's own program: starts loomwatchd and keeps LoomWatch in the menu bar."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "LoomWatch"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
tao = "0.37"
tray-icon = "0.26"

[lints]
workspace = true
