[package]
name = "loomwatch-app"
version = "0.15.3"
description = "LoomWatch's own app program: starts loomwatchd and keeps LoomWatch in the menu bar (macOS) or the notification area (Windows)."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "LoomWatch"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Checks an update's download against its release's checksum.
sha2 = "0.10"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tao = "0.37"
tray-icon = "0.26"

# The island at the notch (ADR 0083): a see-through panel over the menu bar, with a web view of
# LoomWatch's own island page in it. `tao` and `tray-icon` already bring these in.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "NSArray",
  "NSDictionary",
  "NSError",
  "NSGeometry",
  "NSKeyValueCoding",
  "NSNotification",
  "NSObject",
  "NSOperation",
  "NSString",
  "NSURL",
  "NSURLRequest",
  "NSValue",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-core-foundation",
  "NSApplication",
  "NSColor",
  "NSDragging",
  "NSEvent",
  "NSFilePromiseReceiver",
  "NSGraphics",
  "NSPanel",
  "NSPasteboard",
  "NSPasteboardItem",
  "NSResponder",
  "NSRunningApplication",
  "NSScreen",
  "NSView",
  "NSWindow",
  "NSWorkspace",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-app-kit",
  "objc2-core-foundation",
  "WKFrameInfo",
  "WKNavigation",
  "WKNavigationDelegate",
  "WKOpenPanelParameters",
  "WKScriptMessage",
  "WKScriptMessageHandler",
  "WKUIDelegate",
  "WKUserContentController",
  "WKWebView",
  "WKWebViewConfiguration",
] }

[target.'cfg(windows)'.dependencies]
# Start at login (the Run key) and the PATH a new sign-in would have.
winreg = "0.56"

# LoomWatch.exe's icon, from packaging/windows/LoomWatch.ico; build.rs adds it only when building
# for Windows.
[build-dependencies]
winresource = { version = "0.1.34", default-features = false }

# The editing keys at the notch are an `AppKit` menu, which is made only on the main thread, where
# libtest runs no test: their test is a program of its own, which presses keys at the menu.
[[test]]
name = "edit_keys"
harness = false

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "NSMenu",
  "objc2-core-graphics",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
  "std",
  "CGEvent",
  "CGEventTypes",
  "CGRemoteOperation",
] }

# The workspace's lints, except that `unsafe` code is denied rather than forbidden, so that the one
# module that calls `AppKit` and `WebKit` for the island at the notch (`notch_panel.rs`, ADR 0083)
# can allow it for itself, as can the test of the editing keys there. Everything else in the
# workspace still forbids it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
