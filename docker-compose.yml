services:
  loomwatch:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    user: "${LOOMWATCH_UID:-1000}:${LOOMWATCH_GID:-1000}"
    read_only: true
    environment:
      HOME: /home/node
      # The run history, the OpenRouter key (keys.json) and LoomWatch's skills are in its state
      # folder, inside the loomwatch-home volume, so they outlive the container.
      LOOMWATCH_STATE_DIR: /home/node/.local/state/loomwatch
      LOOMWATCH_ALLOW_CONTAINER_LISTENER: "true"
    command:
      - serve
      - --teams-root
      - /data/teams
      - --listen
      - 0.0.0.0:3000
      - --allow-host
      - localhost
      - --allow-host
      - 127.0.0.1
    ports:
      - "127.0.0.1:${LOOMWATCH_PORT:-3000}:3000"
    tmpfs:
      - /tmp
    volumes:
      - ${LOOMWATCH_TEAMS_DIR:-./teams}:/data/teams
      - ${LOOMWATCH_WORKSPACES_DIR:-./container/workspaces}:/workspaces
      - loomwatch-home:/home/node
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /workspace
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - rust-target:/workspace/target

volumes:
  loomwatch-home:
  cargo-registry:
  cargo-git:
  rust-target:
