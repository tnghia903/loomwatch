<!doctype html>
<!--
  The picture Facebook, LinkedIn, X and chat apps show when someone shares a link to the landing
  page (og:image). Render it after changing this file, and commit social-card.jpg:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu \
      --hide-scrollbars --force-device-scale-factor=2 --window-size=1200,630 \
      --user-data-dir="$(mktemp -d)" --screenshot=/tmp/social-card.png "file://$PWD/site/social-card.html"
    sips -z 630 1200 -s format jpeg -s formatOptions 86 /tmp/social-card.png --out site/social-card.jpg

  Chrome may keep running after it writes the file; quit it once the PNG exists. The card is
  1200x630 (the 1.91:1 shape every network crops to), rendered at 2x and scaled down, and has to
  stay under 300 KB, or WhatsApp and Zalo show the link without it.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>LoomWatch social card</title>
<link rel="stylesheet" href="../docs/design-system/fonts/fonts.css">
<style>
  :root {
    --ground: #08080A; --ground-dot: #1E1E23; --ink: #F5F3EE; --ink-2: #A9A59C; --ink-3: #85817A;
    --accent: #E9C46A; --hairline: rgb(255 255 255 / 0.12);
    --serif: 'Instrument Serif', Georgia, serif; --sans: 'Inter', -apple-system, sans-serif;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--ground); }
  body {
    position: relative; color: var(--ink); font-family: var(--sans);
    background-image: radial-gradient(var(--ground-dot) 1px, transparent 1.2px);
    background-size: 22px 22px;
  }
  .glow {
    position: absolute; inset: auto -120px -260px auto; width: 760px; height: 620px;
    background: radial-gradient(closest-side, rgb(233 196 106 / 0.16), transparent);
  }
  .copy { position: absolute; left: 72px; top: 64px; width: 560px; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand svg { width: 70px; height: 30px; }
  .brand span { font-family: var(--serif); font-size: 40px; letter-spacing: 0.2px; }
  h1 {
    margin-top: 54px; font-family: var(--serif); font-weight: 400; font-size: 70px; line-height: 1.02;
    letter-spacing: -0.5px;
  }
  h1 em { font-style: normal; color: var(--accent); }
  p.lede { margin-top: 26px; font-size: 23px; line-height: 1.42; color: var(--ink-2); }
  p.lede b { color: var(--ink); font-weight: 600; }
  .foot {
    position: absolute; left: 72px; bottom: 56px; display: flex; gap: 14px; align-items: center;
    font-size: 19px; color: var(--ink-3);
  }
  .foot .pill {
    border: 1px solid var(--hairline); border-radius: 999px; padding: 7px 16px; color: var(--ink);
  }
  .foot .url { color: var(--accent); font-weight: 600; margin-left: 6px; }
  .shot {
    position: absolute; left: 672px; top: 70px; width: 700px; border-radius: 16px; overflow: hidden;
    border: 1px solid var(--hairline);
    box-shadow: 0 30px 80px rgb(0 0 0 / 0.65), 0 0 0 1px rgb(0 0 0 / 0.6);
  }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="copy">
    <div class="brand">
      <svg viewBox="0 0 102 44" fill="none" stroke="#E9C46A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path opacity=".34" d="M6 10 24 34 42 10 60 34 78 10 96 34"/>
        <path d="M6 34 24 10 42 34 60 10 78 34 96 10"/>
      </svg>
      <span>LoomWatch</span>
    </div>
    <h1>Put your AI apps to work <em>as a team.</em></h1>
    <p class="lede">Connect <b>Claude Code</b>, <b>Codex</b> and <b>OpenCode</b> on one canvas, ask in plain
      words, watch every step and approve the work before the next agent builds on it.</p>
  </div>
  <div class="foot">
    <span class="pill">Free &amp; open source</span>
    <span class="pill">Runs on your Mac</span>
    <span class="url">loomwatch.github.io</span>
  </div>
  <div class="shot"><img src="../docs/assets/readme/run-dark.png" alt=""></div>
</body>
</html>
