<!doctype html>
<!--
  The picture Facebook, LinkedIn, X and chat apps show when someone shares a link to the landing
  page (og:image). Render it after changing this file, and commit social-card.jpg:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu \
      --hide-scrollbars --force-device-scale-factor=2 --window-size=1200,630 \
      --user-data-dir="$(mktemp -d)" --screenshot=/tmp/social-card.png "file://$PWD/site/social-card.html"
    sips -z 630 1200 -s format jpeg -s formatOptions 86 /tmp/social-card.png --out site/social-card.jpg

  Chrome may keep running after it writes the file; quit it once the PNG exists. The card is
  1200x630 (the 1.91:1 shape every network crops to), rendered at 2x and scaled down, and has to
  stay under 300 KB, or WhatsApp and Zalo show the link without it. Networks cache the picture by its
  address, so bump the ?v= on og:image and twitter:image in index.html too.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>LoomWatch social card</title>
<link rel="stylesheet" href="../ui/public/fonts/fonts.css">
<style>
  :root {
    --ground: #08080A; --ground-dot: #1E1E23; --ink: #F5F3EE; --ink-2: #A9A59C; --ink-3: #85817A;
    --accent: #E9C46A; --hairline: rgb(255 255 255 / 0.12);
    --serif: 'Fraunces', Georgia, serif; --sans: 'Inter', -apple-system, sans-serif;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--ground); }
  body {
    position: relative; color: var(--ink); font-family: var(--sans);
    background-image: radial-gradient(var(--ground-dot) 1px, transparent 1.2px);
    background-size: 22px 22px;
  }
  .glow {
    position: absolute; inset: auto -120px -260px auto; width: 760px; height: 620px;
    background: radial-gradient(closest-side, rgb(233 196 106 / 0.16), transparent);
  }
  .copy { position: absolute; left: 72px; top: 64px; width: 540px; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand .mark { width: 64px; height: 64px; }
  .brand .name { width: 223px; height: 41px; }
  h1 {
    margin-top: 44px; font-family: var(--serif); font-weight: 400; font-size: 54px; line-height: 1.02;
    letter-spacing: -0.5px;
  }
  h1 em { font-style: normal; color: var(--accent); }
  p.lede { margin-top: 24px; font-size: 22px; line-height: 1.42; color: var(--ink-2); }
  p.lede b { color: var(--ink); font-weight: 600; }
  .foot {
    position: absolute; left: 72px; bottom: 56px; display: flex; gap: 14px; align-items: center;
    font-size: 19px; color: var(--ink-3);
  }
  .foot .pill {
    border: 1px solid var(--hairline); border-radius: 999px; padding: 7px 16px; color: var(--ink);
  }
  .foot .url { color: var(--accent); font-weight: 600; margin-left: 6px; }
  .loom { position: absolute; left: 640px; top: 58px; width: 520px; height: 470px; }
  .loom line { stroke: rgb(255 255 255 / 0.13); stroke-width: 2; }
  .loom path { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; opacity: 0.32; }
  .loom .you { stroke: var(--accent); stroke-dasharray: 5 5; opacity: 0.55; }
  .crew {
    position: absolute; left: 590px; top: 196px; width: 620px;
    filter: drop-shadow(0 18px 30px rgb(0 0 0 / 0.5));
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="copy">
    <div class="brand">
      <!-- docs/assets/brand/mark.svg and wordmark-dark.svg -->
      <svg class="mark" viewBox="0 0 512 512" aria-hidden="true">
        <rect width="512" height="512" rx="112" fill="#08080A"/>
        <path d="M256 44H382A86 86 0 0 1 468 130V382A86 86 0 0 1 382 468H130A86 86 0 0 1 44 382V130A86 86 0 0 1 130 44Z" fill="none" stroke="#D8A93C" stroke-width="10" stroke-linecap="round" stroke-dasharray="16.26 22.45" stroke-dashoffset="8.13"/>
        <rect x="170" y="170" width="52" height="112" rx="26" fill="#F5F3EE"/>
        <rect x="290" y="170" width="52" height="112" rx="26" fill="#F5F3EE"/>
        <path d="M230 330Q256 352 282 330" fill="none" stroke="#E9C46A" stroke-width="28" stroke-linecap="round"/>
      </svg>
      <svg class="name" viewBox="-5.5 14.5 500 91" role="img" aria-label="LoomWatch">
        <g fill="none" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
          <path stroke="#F5F3EE" d="M0 20V100M13 75a25 25 0 1 0 50 0a25 25 0 1 0-50 0M74 75a25 25 0 1 0 50 0a25 25 0 1 0-50 0M138 50V100M138 67a16 16 0 0 1 32 0V100M170 67a16 16 0 0 1 32 0V100M215 50L231 100L247 56L263 100L279 50M291 75a25 25 0 1 0 50 0a25 25 0 1 0-50 0M341 50V100M361 28V86q0 14 14 14M430.73 56.42A25 25 0 1 0 430.73 93.58M449 20V100M449 70a20 20 0 0 1 40 0V100"/>
          <path stroke="#E9C46A" d="M351 50H375"/>
        </g>
      </svg>
    </div>
    <h1>Put AI agents to work as one team. <em>They improve themselves.</em></h1>
    <p class="lede">A team of AI agents on your Mac or Windows PC, thinking with <b>Claude</b>, <b>GPT</b>
      or any model on OpenRouter. They pass work along, pause for your OK, and keep a record of every step.</p>
  </div>
  <div class="foot">
    <span class="pill">Free &amp; open source</span>
    <span class="pill">Runs on Mac &amp; Windows</span>
    <span class="url">loomwatch.github.io</span>
  </div>
  <svg class="loom" viewBox="0 0 520 470" aria-hidden="true">
    <line x1="30" y1="0" x2="30" y2="470"/><line x1="145" y1="0" x2="145" y2="470"/><line x1="260" y1="0" x2="260" y2="470"/>
    <line x1="375" y1="0" x2="375" y2="470"/><line class="you" x1="490" y1="0" x2="490" y2="470"/>
    <path d="M10 46H510"/><path d="M10 102H510"/><path d="M10 404H510"/>
  </svg>
  <img class="crew" src="assets/crew/crew.webp" alt="">
</body>
</html>
