# Pinned versions (action SHAs, Cargo.lock, pnpm-lock.yaml) only stay safe if something proposes
# updates. Monthly and grouped, so each ecosystem costs at most one or two CI runs a month.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      ui-minor-and-patch:
        update-types: [minor, patch]
