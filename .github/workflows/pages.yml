name: Pages

# Publishes the landing page in site/ to https://loomwatch.github.io, together with the installer
# (scripts/install.sh, served as /install.sh). The built page is pushed to the
# loomwatch/loomwatch.github.io repository, and GitHub Pages serves that repository's main branch.
# It runs when the page, the installer, the screenshots it borrows from docs/assets/readme, the
# agent figures and live-figure code it borrows from ui/, the design-system fonts or this workflow
# change on main, and by hand.
#
# The push uses PAGES_DEPLOY_KEY, the private half of an SSH deploy key that has write access to
# loomwatch/loomwatch.github.io and nothing else.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - scripts/install.sh
      - docs/assets/readme/**
      - ui/public/fonts/**
      - ui/public/agent/**
      - ui/src/site/**
      - ui/src/components/agents/workbenchScene.ts
      - ui/src/components/agents/benchTextures.ts
      - ui/vite.site.config.ts
      - examples/skills/**
      - .github/workflows/pages.yml
  workflow_dispatch:

# One publish at a time. A newer push waits rather than cancelling one that is mid-push.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: loomwatch.github.io
      url: https://loomwatch.github.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The page's live figures are built from the app's own code (ui/src/site), so the site needs
      # ui's packages, with the same Node and pnpm as CI.
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          node-version-file: .node-version
          cache: true
          cache-dependency-path: ui/pnpm-lock.yaml
          install: false
      - name: Install
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Assemble the site
        run: |
          site/build.sh _site
          # Serve the files as they are; Pages would otherwise run Jekyll over them.
          touch _site/.nojekyll
      - name: Push it to loomwatch/loomwatch.github.io
        env:
          DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/pages_key"
          known="$RUNNER_TEMP/known_hosts"
          printf '%s\n' "$DEPLOY_KEY" >"$key"
          chmod 600 "$key"
          # GitHub's SSH host keys, read over HTTPS rather than trusted on first use.
          curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' >"$known"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$known -o StrictHostKeyChecking=yes"

          git clone --quiet --depth 1 git@github.com:loomwatch/loomwatch.github.io.git published
          find published -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R _site/. published/
          cd published
          git add --all
          if git diff --cached --quiet; then
            echo "The published site already matches this commit."
            exit 0
          fi
          git -c user.name="LoomWatch Pages" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "Publish the landing page from ${GITHUB_SHA::7}"
          git push --quiet origin HEAD:main
          echo "Published to https://loomwatch.github.io"
