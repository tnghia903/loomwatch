name: Pull requests

# Runs ci.yml on every pull request, as main does. Standard GitHub-hosted runners are free for a
# public repository, so this costs nothing, and it keeps going while the author's computer sleeps.
# scripts/ci-local.sh is a quicker check to run first, when you want one (docs/CI.md).
#
# Keep the trigger `pull_request`: a fork's run gets a read-only token and no secrets, and a
# first-time contributor's run waits for a maintainer to approve it. Never `pull_request_target`,
# which would run the fork's code with this repository's token and secrets.
on:
  pull_request:

# A newer push to the same pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
