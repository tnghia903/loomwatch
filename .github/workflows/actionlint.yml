name: Workflow lint

# A broken workflow file fails silently or not at all until it runs; lint it on the change instead.
# Pull requests run nothing here: scripts/ci-local.sh lints a maintainer's branch, and a pull
# request from a fork or Dependabot is linted once it reaches main.
on:
  push:
    branches: [main]
    paths: [".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Built from an exact module version; the Go checksum database verifies the download.
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint workflows
        run: '"$(go env GOPATH)/bin/actionlint"'
