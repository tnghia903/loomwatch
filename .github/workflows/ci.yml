name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: loomwatch
          POSTGRES_PASSWORD: loomwatch
          POSTGRES_DB: loomwatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loomwatch -d loomwatch"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://loomwatch:loomwatch@localhost:5432/loomwatch
    steps:
      - uses: actions/checkout@v6
      - name: Check
        run: cargo check --workspace
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Format
        run: cargo fmt --all -- --check
      - name: Validate team schema and examples
        run: cargo test --package loomwatch-backend --test team_schema
