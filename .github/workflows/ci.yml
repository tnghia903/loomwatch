name: CI

# Runs on every pull request (pull-requests.yml calls it), on main once a change has merged, and by
# hand: `gh workflow run ci.yml --ref <branch>` runs it on a branch with no pull request.
#
# Never add `pull_request_target`: it would run a fork's code with this repository's token and
# secrets.
on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

# No concurrency group, so every commit on main keeps a result of its own: a group would drop a run
# still waiting behind another when several merges land together.

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm comes from `packageManager` in the root package.json, Node from .node-version, so CI,
      # the README and local tooling read the same versions.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          node-version-file: .node-version
          cache: true
          cache-dependency-path: ui/pnpm-lock.yaml
          install: false
      - name: Install
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: ui
        run: pnpm run lint --deny-warnings
      - name: Build (includes typecheck)
        working-directory: ui
        run: pnpm run build
      - name: Test
        working-directory: ui
        run: pnpm test
      # The backend embeds ui/dist at compile time, so the Rust job builds on this exact output.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error
          retention-days: 1

  # The scripts that run LoomWatch from source and pack its apps.
  launcher:
    name: Launcher
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ShellCheck comes with the runner image.
      - name: ShellCheck
        run: shellcheck loomwatch scripts/package-release.sh scripts/package-macos-app.sh scripts/ci-local.sh

  # The archive is SQLite: every database test makes a file of its own, so this job needs no
  # database service.
  rust:
    name: Rust
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A daemon-only setting for the test that proves agents never inherit one.
      LOOMWATCH_DAEMON_ONLY_PROBE: set
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: ui/dist
      # The toolchain comes from rust-toolchain.toml. Only main writes the cache, so a run on a
      # branch restores it without storing a near-duplicate copy.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Cheapest check first. `cargo test --workspace` also runs tests/team_schema.rs, and Clippy
      # type-checks everything, so neither needs a step of its own.
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  # The quality bench's developer build of the daemon, with the `prompt-overrides` feature: every
  # fixed text agents are given can be replaced by a file (docs/ARCHITECTURE.md). This is the one
  # build that turns the feature on, and nothing it makes ships. The Rust job's tests prove that the
  # program built without it has no way to read overrides.
  prompt-overrides:
    name: Rust with prompt overrides
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOOMWATCH_DAEMON_ONLY_PROBE: set
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: ui/dist
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy -p loomwatch-backend --all-targets --locked --features prompt-overrides -- -D warnings
      - name: Test
        run: cargo test -p loomwatch-backend --locked --features prompt-overrides

  # Windows: the same checks, then the app's files and its installer tried the ways a person uses
  # them by scripts/smoke-windows.ps1: the program driven through the offline demo, LoomWatch.exe,
  # and LoomWatch-windows-setup.exe. The archive is SQLite, so it needs no database service
  # either.
  windows:
    name: Windows
    needs: frontend
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      LOOMWATCH_DAEMON_ONLY_PROBE: set
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: ui/dist
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Windows PowerShell 5.1, which the launcher and the packing scripts are written for, must read
      # them: every one parses, and is ASCII (5.1 reads a file without a byte-order mark in the local
      # code page).
      - name: PowerShell scripts parse
        shell: powershell
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem -Path scripts -Filter *.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors)
            foreach ($e in $errors) { Write-Host "::error file=scripts/$($file.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $failed = $true }
            if ([IO.File]::ReadAllBytes($file.FullName) | Where-Object { $_ -gt 127 }) { Write-Host "::error file=scripts/$($file.Name)::not ASCII"; $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Clippy
        id: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast
      # Run even when a test failed: whether LoomWatch installs and runs on Windows is worth
      # knowing on its own. The job fails either way.
      - name: Gather the app's files
        if: ${{ !cancelled() && steps.clippy.outcome == 'success' }}
        shell: bash
        run: |
          cargo build --locked --bin loomwatchd --bin LoomWatch
          scripts/package-release.sh windows-x86_64 target/debug/loomwatchd.exe dist target/debug/LoomWatch.exe
      - name: Build the installer
        if: ${{ !cancelled() && steps.clippy.outcome == 'success' }}
        shell: pwsh
        run: scripts/package-windows-app.ps1 -Zip dist/loomwatch-windows-x86_64.zip -Out dist
      - name: Install, start, and run the offline demo
        if: ${{ !cancelled() && steps.clippy.outcome == 'success' }}
        shell: pwsh
        run: scripts/smoke-windows.ps1 -Dist dist

  # Compares a pull request with its base, or main before and after a push. Fails when the change
  # adds a dependency, in Cargo.lock or ui/pnpm-lock.yaml, with a known vulnerability of moderate
  # severity or worse. It reads GitHub's dependency graph, so it needs no checkout and can't run on
  # a computer. A pull request's own refs come first: on a new push to one, `github.event.before`
  # is its previous head, not its base.
  dependency-review:
    name: Dependency review
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fail-on-severity: moderate
          # glib is in Cargo.lock only as the Linux (GTK) dependency of tao and tray-icon, which
          # crates/loomwatch-app uses on macOS alone, so it is never built for any platform
          # LoomWatch ships: `cargo tree --workspace --target <platform> -i glib` prints nothing for
          # Linux, Windows and macOS. Its advisory concerns an iterator in glib's GVariant API.
          allow-ghsas: GHSA-wrw7-89jp-8q8g

  # One answer for the whole run, so adding or renaming a job never changes what to read. It waits
  # for every job above and fails unless each one passed; Dependency review may be skipped, because
  # a run by hand has nothing to compare. It runs even when a job fails (`always()`): skipped, it
  # would count as passed.
  result:
    name: CI result
    if: always()
    needs: [frontend, launcher, rust, prompt-overrides, windows, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'to_entries | all(.value.result == "success"
            or (.key == "dependency-review" and .value.result == "skipped"))' <<<"$NEEDS" >/dev/null
