name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Build (includes typecheck)
        run: pnpm run build
      - name: Test
        run: pnpm test
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

  rust:
    needs: frontend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: loomwatch
          POSTGRES_PASSWORD: loomwatch
          POSTGRES_DB: loomwatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loomwatch -d loomwatch"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://loomwatch:loomwatch@localhost:5432/loomwatch
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - name: Check
        run: cargo check --workspace
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Format
        run: cargo fmt --all -- --check
      - name: Validate team schema and examples
        run: cargo test --package loomwatch-backend --test team_schema
