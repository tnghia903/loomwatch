name: CI

# One run per change: pushes to main, and pull requests (which already cover their branch's
# pushes). Pushing a feature branch alone runs nothing; open a pull request or dispatch by hand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request cancels the older run. Runs on main are never cancelled,
# so every commit on main keeps a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm comes from `packageManager` in the root package.json, Node from .node-version, so CI,
      # the README and local tooling read the same versions.
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          node-version-file: .node-version
          cache: true
          cache-dependency-path: ui/pnpm-lock.yaml
          install: false
      - name: Install
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: ui
        run: pnpm run lint --deny-warnings
      - name: Build (includes typecheck)
        working-directory: ui
        run: pnpm run build
      - name: Test
        working-directory: ui
        run: pnpm test
      # The backend embeds ui/dist at compile time, so the Rust job builds on this exact output.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error
          retention-days: 1

  # The launcher and installer are what an update runs on every operator's computer (ADR 0052).
  launcher:
    name: Launcher
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ShellCheck comes with the runner image.
      - name: ShellCheck
        run: shellcheck loomwatch scripts/install.sh scripts/package-release.sh scripts/test-update.sh
      - name: Update and rollback
        run: scripts/test-update.sh

  rust:
    name: Rust
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: loomwatch
          POSTGRES_PASSWORD: loomwatch
          POSTGRES_DB: loomwatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loomwatch -d loomwatch"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://loomwatch:loomwatch@localhost:5432/loomwatch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: ui/dist
      # The toolchain comes from rust-toolchain.toml. Only main writes the cache, so pull requests
      # restore it without each storing a near-duplicate copy.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Cheapest check first. `cargo test --workspace` also runs tests/team_schema.rs, and Clippy
      # type-checks everything, so neither needs a step of its own.
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
