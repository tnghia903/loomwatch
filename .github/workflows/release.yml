name: Release

# Builds the two ways people get LoomWatch, each with a checksum: LoomWatch-macos.dmg, the
# LoomWatch.app for Apple silicon and Intel Macs (scripts/package-macos-app.sh), and
# LoomWatch-windows-setup.exe, which installs LoomWatch for the person running it
# (scripts/package-windows-app.ps1, from the files scripts/package-release.sh gathers). The apps'
# Update and restart downloads them too. A version tag such as v0.1.0 puts them on a DRAFT GitHub
# release; publish it by hand once its files have been tried, because the apps always take the
# newest published release. Run it by hand to build the files without a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  ui:
    name: Browser app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A tag that disagrees with the version the program reports would mislabel every bug report.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/loomwatch-backend/Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match version $version in crates/loomwatch-backend/Cargo.toml."
            exit 1
          fi
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          node-version-file: .node-version
          cache: true
          cache-dependency-path: ui/pnpm-lock.yaml
          install: false
      - name: Build
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      # The program embeds ui/dist when it is compiled, so every platform builds on this output.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error
          retention-days: 1

  macos:
    name: macOS
    needs: ui
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # The oldest macOS the program starts on.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: ui/dist
      # The toolchain comes from rust-toolchain.toml; Intel Macs need its x86_64 target as well.
      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build for Apple silicon
        run: cargo build --release --locked --bin loomwatchd --target aarch64-apple-darwin
      - name: Build for Intel
        run: cargo build --release --locked --bin loomwatchd --target x86_64-apple-darwin
      - name: Join them into one program
        run: |
          mkdir -p build
          lipo -create -output build/loomwatchd \
            target/aarch64-apple-darwin/release/loomwatchd \
            target/x86_64-apple-darwin/release/loomwatchd
          lipo -info build/loomwatchd
          build/loomwatchd --help >/dev/null
      - name: Build the app for Apple silicon and Intel
        run: |
          cargo build --release --locked -p loomwatch-app --target aarch64-apple-darwin
          cargo build --release --locked -p loomwatch-app --target x86_64-apple-darwin
          lipo -create -output build/LoomWatch \
            target/aarch64-apple-darwin/release/LoomWatch \
            target/x86_64-apple-darwin/release/LoomWatch
          lipo -info build/LoomWatch
      # dmgbuild lays out the .dmg's window (packaging/macos/dmg-settings.py), pinned by hash.
      - name: Install dmgbuild
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --require-hashes -r packaging/macos/dmgbuild-requirements.txt
          echo "$RUNNER_TEMP/dmgbuild/bin" >>"$GITHUB_PATH"
      # Signing and notarizing need an Apple Developer account. Until its secrets are set, the app is
      # signed ad hoc, and macOS asks people once to allow it (System Settings, Privacy & Security).
      - name: Package LoomWatch.app
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY_NAME: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ]; then
            keychain=$RUNNER_TEMP/signing.keychain-db
            keychain_password=$(openssl rand -hex 24)
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            printf '%s' "$MACOS_CERTIFICATE" | base64 --decode >"$RUNNER_TEMP/certificate.p12"
            security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            rm -f "$RUNNER_TEMP/certificate.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
            security list-keychains -d user -s "$keychain" login.keychain-db
            export MACOS_SIGN_IDENTITY="$MACOS_SIGN_IDENTITY_NAME"
            if [ -n "$APPLE_ID" ]; then
              xcrun notarytool store-credentials loomwatch --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
              export MACOS_NOTARY_PROFILE=loomwatch
            fi
          fi
          scripts/package-macos-app.sh build/loomwatchd build/LoomWatch dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-universal
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows
    needs: ui
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      # The C runtime inside the program, so it starts on a Windows without the Visual C++
      # Redistributable installed.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: ui/dist
      - name: Build
        run: cargo build --release --locked --bin loomwatchd --bin LoomWatch
      # The files the installer puts in place, gathered in build/: not a release file of their own.
      - name: Gather the app's files
        shell: bash
        run: |
          target/release/loomwatchd.exe --help >/dev/null
          scripts/package-release.sh windows-x86_64 target/release/loomwatchd.exe build target/release/LoomWatch.exe
      # Unsigned until a code-signing certificate is set up: Windows then asks people once, in a
      # "Windows protected your PC" box (More info, then Run anyway).
      - name: Build the installer
        shell: pwsh
        run: scripts/package-windows-app.ps1 -Zip build/loomwatch-windows-x86_64.zip -Out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  draft:
    name: Draft the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create a draft release with the files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "LoomWatch $GITHUB_REF_NAME" \
            --generate-notes
