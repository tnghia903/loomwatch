  @keyframes weft { 0%, 58% { stroke-dashoffset: 0; opacity: .34; } 66% { stroke-dashoffset: 0; opacity: 0; } 72% { stroke-dashoffset: -100; opacity: .34; } 97%, 100% { stroke-dashoffset: 0; opacity: .34; } }
