<svg xmlns="http://www.w3.org/2000/svg" width="102" height="44" viewBox="0 0 102 44" fill="none" stroke="#8A6A16" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="LoomWatch">
<style>
  .warp, .weft { stroke-dasharray: 100 100; animation-duration: 7s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
