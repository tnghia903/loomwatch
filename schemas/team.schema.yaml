$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://loomwatch.dev/schemas/team.schema.yaml"
title: LoomWatch team configuration
description: >-
  Versioned source-of-truth configuration for one LoomWatch team. Runtime-only
  records use the reusable Edge and RunEvent definitions under $defs.
type: object
additionalProperties: false
required:
  - schemaVersion
  - id
  - name
  - entrypoint
  - agents
  - edges
properties:
  schemaVersion:
    description: Major schema version. Unknown versions must be rejected.
    const: 1
  id:
    $ref: "#/$defs/Identifier"
  name:
    type: string
    minLength: 1
  budget:
    $ref: "#/$defs/RetiredBudget"
  spend:
    description: >-
      What one run of this team may spend on model calls, in US dollars (ADR 0068). Every agent of
      the run draws on it: stages, the lead, Team Bus helpers, summaries and checkpoints. Once a
      run has used it, the agents wait and the operator chooses to add money and carry on, or to
      finish with what the team has. A scheduled run has nobody to ask, so it stops and keeps its
      checkpoints. Absent means no limit; new teams are written with 1.00. A call's cost is known
      only after it is made, so one call can take a run a few cents past its figure.
    $ref: "#/$defs/Spend"
  guards:
    description: Server-enforced limits for delegation through the Team Bus.
    $ref: "#/$defs/Guards"
  entrypoint:
    description: Agent that receives the initial goal in team or pipeline mode.
    $ref: "#/$defs/Identifier"
  responder:
    description: >-
      Optional agent whose reply becomes the canonical team output. In pipeline mode it may name
      any agent in the configured pipeline. In team mode it must match the entrypoint. When omitted,
      the entrypoint responds in team mode and the final pipeline stage responds in pipeline mode.
    $ref: "#/$defs/Identifier"
  agents:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/Agent"
  edges:
    description: User-configured pipeline edges. Observed edges are runtime data.
    type: array
    items:
      allOf:
        - $ref: "#/$defs/Edge"
        - type: object
          properties:
            layer:
              const: configured
            kind:
              const: sequence
  schedule:
    description: >-
      Optional routine: run this team on a cron schedule with a fixed prompt and deliver
      the canonical reply to the operator's connected destination.
    $ref: "#/$defs/Schedule"
  deliver:
    description: >-
      Where every successful run's answer goes, whoever started it — a run from the canvas, a
      routine, or Ask LoomWatch. With `notion`, the answer becomes a new child page of the
      Notion destination chosen in Connections; the default title is "{{team}} — {{date}}
      {{time}}". A routine's own `schedule.deliver` wins for scheduled runs. See ADR 0038.
    $ref: "#/$defs/Deliver"
  permissions:
    description: >-
      Who decides what the agents' `allow:` switches leave open. `ask` (the default) puts each
      request to the operator during the run. `auto` runs, without asking, a command that only
      reads (inside the agent's folder, its knowledge or the temporary folder) or downloads (for
      an agent allowed the web); every other command still goes to the operator, and commands on
      a fixed list (administrator, deleting, pushing, publishing, deploying, credentials, scripts
      given as text) always do. Decided on this computer from the command line alone. See
      ADR 0061.
    type: object
    additionalProperties: false
    properties:
      mode:
        type: string
        enum: [ask, auto]
        default: ask
  conversation:
    description: >-
      How much a pipeline stage hands forward, and how much it may ask back. Defaults suit a
      short chain; raise the brief bounds for stages whose output cannot be summarised, and the
      ask budget for stages that genuinely need to interrogate their predecessor.
    $ref: "#/$defs/Conversation"
  memory:
    description: >-
      What the team knows before a run starts. The Brief is Markdown beside this file, so it is
      diffable and reviewable like the rest of the design; the run archive holds only what agents write.
      Omitting this block, or setting `enabled: false`, leaves every prompt byte-for-byte what it
      was before memory existed. See docs/TEAM_MEMORY.md and ADR 0014.
    $ref: "#/$defs/Memory"

$defs:
  Conversation:
    type: object
    additionalProperties: false
    properties:
      brief:
        $ref: "#/$defs/Brief"
      ask:
        $ref: "#/$defs/Ask"
      check:
        $ref: "#/$defs/Check"
      stop:
        $ref: "#/$defs/Stop"

  Check:
    description: >-
      What a check step (`checks:`) is shown besides the work it checks.
    type: object
    additionalProperties: false
    properties:
      givenChars:
        description: >-
          The most of what the checked agent was given (the results of the stages before it, the
          operator's direction, what the team knows) that its check step is shown, in characters.
          It lets the check trace a claim to what the work was written from instead of opening the
          claim's source. Shared fairly when several stages fed the checked agent. 0 shows none.
        type: integer
        minimum: 0
        maximum: 24000
        default: 8000

  Stop:
    description: >-
      Bounds on a review stop or a parked `ask_user`. Kept so older team files still load: an
      agent waiting for the operator is parked as data, with nothing running, so no window applies
      to it.
    type: object
    additionalProperties: false
    properties:
      keepAliveMinutes:
        description: >-
          Accepted so older team files still load, and read by nothing. It bounded how long a
          third-party app's session could idle while you decided; a parked agent has nothing
          running, so it no longer limits a wait.
        type: integer
        minimum: 1
        default: 15

  Brief:
    description: >-
      What a stage hands the stages after it. A reply that fits is handed on as written; a longer
      one is summarised first, in a handover the stage writes in the session it already built,
      and these bounds shape that handover.
    type: object
    additionalProperties: false
    properties:
      summaryChars:
        description: Character budget for a handover's summary section.
        type: integer
        minimum: 1
        default: 1200
      maxFindings:
        description: How many standalone findings a handover may carry forward.
        type: integer
        minimum: 0
        default: 8
      asWrittenUpTo:
        description: >-
          The longest reply, in characters, handed on as written. Where several stages feed one,
          they share it. Longer replies get a handover. At most 24000, the most of a handed
          section one prompt carries; 0 asks every stage for a handover.
        type: integer
        minimum: 0
        maximum: 24000
        default: 24000

  Memory:
    description: >-
      The `memory:` block. This is executable configuration in ADR 0012's sense — it changes what
      the daemon sends to an agent — so it lives here rather than in the layout sidecar.
    type: object
    additionalProperties: false
    properties:
      enabled:
        description: >-
          An explicit off switch, so an operator can stop supplying memory without deleting the
          block. `false` behaves exactly like no block at all.
        type: boolean
        default: true
      brief:
        description: >-
          Standing notes from the operator, supplied at every session start within the packet
          budget, in this order. Read only from under the teams root, symlinks included; a file
          that cannot be read refuses the run rather than being skipped.
        type: array
        default: []
        items:
          $ref: "#/$defs/BriefEntry"
      inherits:
        description: >-
          Other teams' memory this team reads. Read-only by construction: no token issued for this
          team carries a write grant for an inherited scope, and a cycle is refused at load.
        type: array
        default: []
        items:
          $ref: "#/$defs/Inherit"
      notebook:
        $ref: "#/$defs/Notebook"
      packet:
        $ref: "#/$defs/Packet"
      deliverAs:
        description: >-
          How the Brief reaches an agent. `native-file` also writes it as `AGENTS.md` in a
          managed workspace under `.loomwatch/<team>/<agent>/`, which the agent reads into its
          standing instructions every session, so a context compaction does not reach it; it
          therefore moves the agent out of its declared `cwd`, as wiring a skill already does. An agent that must run inside a repository opts out with
          `packet-only` on the agent itself.
        type: string
        enum:
          - native-file
          - packet-only
        default: native-file

  BriefEntry:
    type: object
    additionalProperties: false
    required:
      - path
    properties:
      path:
        description: >-
          Markdown file, relative to this team file. Absolute paths and paths resolving outside
          the teams root are refused.
        type: string
        minLength: 1
      appliesTo:
        description: >-
          Agent ids this entry is supplied to. Omit for the whole team. An entry left out of an
          agent's packet is still recorded in that packet, with the reason.
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/Identifier"

  Inherit:
    description: >-
      One inherited memory: another team on this daemon by `team`, or an imported pack folder by
      `pack`. Exactly one of the two.
    type: object
    additionalProperties: false
    oneOf:
      - required: [team]
        not:
          required: [pack]
      - required: [pack]
        not:
          required: [team]
    properties:
      team:
        description: >-
          The `id` of another team under the same teams root. Live: that team's later edits show up
          at the next run start, and each run snapshots what it read.
        $ref: "#/$defs/Identifier"
      pack:
        description: >-
          A `<team>.memory/` folder under the teams root, exported from the Memory panel or by
          `loomwatchd memory export`. An imported pack never updates on its own.
        type: string
        minLength: 1
      include:
        description: Which half of the origin's memory to read. Omit for both.
        type: array
        minItems: 1
        items:
          type: string
          enum:
            - brief
            - kept
            - both
      appliesTo:
        description: >-
          Agent ids this inherited memory reaches. Omit for the whole team. Drawn on the canvas as
          a `reads` edge from that agent to the memory card.
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/Identifier"
      exclude:
        description: >-
          Inherited Brief entries to leave out, by the path the origin team spells them with. The
          receiving team cannot edit another team's Brief, so declining one entry is the only
          control it has.
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1

  Notebook:
    description: Whether agents may write to the Notebook, and what may outlive a run.
    type: object
    additionalProperties: false
    properties:
      enabled:
        description: >-
          Whether the four memory tools (`memory_search`, `memory_read`, `memory_write`,
          `checkpoint`) are offered on the Team Bus. `false` withdraws them from `tools/list` and
          also refuses a call, so an agent that kept an earlier list cannot write.
        type: boolean
        default: true
      keep:
        description: >-
          How a note outlives its run. `review` means the operator keeps what is worth keeping
          after the run; `never` means notes are evidence for their own run and nothing else.
          `auto` is deliberately absent — a run's notes becoming standing memory with nobody
          reading them is how a team accumulates confident nonsense.
        type: string
        enum:
          - review
          - never
        default: review

  Packet:
    type: object
    additionalProperties: false
    properties:
      maxChars:
        description: >-
          Memory's share of an opening prompt, in characters, the one figure LoomWatch can state
          before the model counts tokens. Pinned Brief content that does not fit refuses the run
          before an agent starts, naming the entries.
        type: integer
        minimum: 1
        default: 8000

  AgentMemory:
    description: Per-agent memory overrides; the team's `memory:` block applies when absent.
    type: object
    additionalProperties: false
    properties:
      brief:
        description: Whether this agent is supplied the team's Brief at all.
        type: boolean
        default: true
      deliverAs:
        description: >-
          Overrides the team's `deliverAs` for this agent. `packet-only` keeps the agent in its
          declared `cwd` — the choice for an agent that must run inside a repository — and costs
          it the one delivery channel that survives a compaction.
        type: string
        enum:
          - native-file
          - packet-only

  Ask:
    type: object
    additionalProperties: false
    properties:
      maxPerStage:
        description: >-
          How many questions one agent may put to another in a run. Clarifying what the other
          asked back continues a question and is not counted. A stage before this one stays
          answerable while the stages it feeds run.
        type: integer
        minimum: 0
        default: 3
      replyChars:
        description: >-
          The most of one answer, in characters, handed back to the agent that asked. A longer
          answer is cut in the middle, keeping its start and its conclusion.
        type: integer
        minimum: 1000
        default: 20000
      roundsPerQuestion:
        description: >-
          How many times an asked agent may ask back about one question (a `## Question back`
          section) before it must answer with its best assumption, saying which. The asker's
          clarifications continue the same question and are not counted against maxPerStage.
          0 lets no agent ask back.
        type: integer
        minimum: 0
        default: 3

  Schedule:
    type: object
    additionalProperties: false
    required:
      - cron
      - prompt
    properties:
      cron:
        description: >-
          Standard 5-field cron at minute resolution (0 or 7 = Sunday), or the 6/7-field
          seconds form (1 = Sunday). Read in `timezone`.
        type: string
        minLength: 1
      timezone:
        description: IANA zone name such as Asia/Singapore; the daemon's local zone when absent.
        type: string
        minLength: 1
      prompt:
        description: >-
          Prompt template. {{date}} expands to YYYY-MM-DD, {{weekday}} to the day name and
          {{time}} to the 24-hour HH:MM in the schedule's zone at fire time; {{team}} to the team
          name.
        type: string
        minLength: 1
      enabled:
        description: Whether timed fires happen; "run now" ignores it.
        type: boolean
        default: true
      deliver:
        description: >-
          Where this routine's answer goes. Overrides the team's top-level `deliver` for scheduled
          runs; the default title here is "{{team}} — {{date}}", one page a day.
        $ref: "#/$defs/Deliver"
      retryAfterMinutes:
        description: >-
          When a timed run fails because it couldn't reach its AI source (the network not back
          yet just after the computer woke, say), wait this many minutes and try again from the
          start: one new try per entry, each named as a retry of the one before. The next timed
          run, "run now" or pausing the routine stops waiting. An empty list never tries again;
          "run now" is never tried again by itself.
        type: array
        maxItems: 20
        items:
          type: integer
          minimum: 1
          maximum: 1440
        default: [1, 2, 5, 10, 30]
      waitForYouMinutes:
        description: >-
          How long a routine's run waits for you when it asks something: a permission, more money
          at its spending limit, or an agent's question. Then the permission is declined, the team
          finishes with what it has, or the agent goes on with its best assumption and says which.
          Review stops in the team wait as long as it takes.
        type: integer
        minimum: 1
        maximum: 10080
        default: 720

  Deliver:
    type: object
    additionalProperties: false
    properties:
      notion:
        description: Publish the reply as a child page of the connected destination.
        type: object
        additionalProperties: false
        properties:
          title:
            description: >-
              Page title template. {{date}} (YYYY-MM-DD), {{weekday}}, {{time}} (24-hour HH:MM) and
              {{team}} expand when the page is made.
            type: string
            minLength: 1

  Identifier:
    type: string
    minLength: 1
    maxLength: 128
    pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"

  OpaqueId:
    description: Opaque identifier stored verbatim and never parsed.
    type: string
    minLength: 1
    maxLength: 512

  Spawn:
    description: >-
      Where the agent works. Absent means the team file's own folder.
    type: object
    additionalProperties: false
    required:
      - cwd
    properties:
      cmd:
        description: >-
          Retired: the AI app an earlier LoomWatch started for the agent. Every agent runs on
          LoomWatch's own engine now. Accepted and ignored, so team files written before then
          still load. Writers must not add it.
        deprecated: true
        type: string
      args:
        description: Retired with `cmd`. Accepted and ignored.
        deprecated: true
        type: array
        items:
          type: string
      env:
        description: Retired with `cmd`. Accepted and ignored.
        deprecated: true
        type: object
        additionalProperties:
          type: string
      cwd:
        description: Absolute path or path relative to the team file.
        type: string
        minLength: 1

  Spend:
    type: object
    additionalProperties: false
    properties:
      perRun:
        description: The most one run may spend, in US dollars.
        type: number
        exclusiveMinimum: 0
      web:
        $ref: "#/$defs/WebLimits"

  WebLimits:
    description: >-
      How much web reading one model call may do, for an agent allowed the web. A page read stays in
      the conversation and is read again on every later call. By default only the page length is
      held; how many pages, searches and steps a call takes is left to OpenRouter (30 steps) unless
      set here. On an agent, each figure it leaves out is the team's. A model whose provider refuses
      the limits reads the web without them rather than failing.
    type: object
    additionalProperties: false
    properties:
      maxPageTokens:
        description: How much of one page is read, in tokens (about three quarters of a word each). A longer page is cut.
        type: integer
        minimum: 500
        maximum: 100000
        default: 16000
      maxPages:
        description: Pages one model call may read. Absent leaves it to OpenRouter.
        type: integer
        minimum: 1
        maximum: 50
      maxSearches:
        description: Searches one model call may run. Absent leaves it to OpenRouter.
        type: integer
        minimum: 1
        maximum: 25
      maxSteps:
        description: Searches and page reads together in one model call. Absent leaves it to OpenRouter's 30.
        type: integer
        minimum: 1
        maximum: 30

  RetiredBudget:
    description: >-
      Retired by ADR 0027: LoomWatch no longer tracks spend or enforces a budget. Accepted at team
      and agent level, in any shape, and ignored, so team files written before then still load.
      Writers must not add it.
    deprecated: true

  Guards:
    type: object
    additionalProperties: false
    properties:
      maxDispatchDepth:
        description: Maximum Team Bus dispatch depth before further dispatches are refused.
        type: integer
        minimum: 0
        default: 8
      maxConcurrentDispatches:
        description: Maximum background dispatch and handoff tasks admitted at one time.
        type: integer
        minimum: 0
        default: 8
      maxHelpers:
        description: >-
          How many helpers an agent working alone (the only agent of its team, such as an agent's
          own chat) may have at work at once: copies of itself it starts on parts of a big task
          (ADR 0079). 0 turns helpers off for the team.
        type: integer
        minimum: 0
        maximum: 8
        default: 4

  Agent:
    description: >-
      One node of the team. A `harness` node (the name is historical) is an agent LoomWatch runs on
      a model, so it must name the model: an OpenRouter model id such as
      `anthropic/claude-opus-5.5`, or `fake/offline` for the offline demo. Older names written for
      an AI app, such as `sonnet` or `gpt-5.5`, are read as the OpenRouter model they name. An `operator` node is the person at the keyboard standing in the pipeline: it has
      an id, sits on edges and takes part in the topological order, and instead of a model it has a
      question — its `role` — which is what the panel shows when the pipeline reaches it. See
      docs/TEAM_MEMORY.md, "The operator is a node".
    type: object
    additionalProperties: false
    required:
      - id
      - role
    oneOf:
      - title: Harness node
        description: An agent, so it must say which model it runs on.
        properties:
          kind:
            const: harness
        required:
          - name
          - model
        not:
          required: [sendBack, sendBackOnce]
      - title: Operator node
        description: >-
          A review stop. `spawn`, `model` and `thinkingEffort` are not merely optional here but
          refused: an operator node works in no folder and selects no model, so declaring one
          would make the file say something the daemon does not do. `name` defaults to "You".
        properties:
          kind:
            const: operator
        required:
          - kind
        not:
          anyOf:
            - required: [spawn]
            - required: [model]
            - required: [followsSuggestion]
            - required: [thinkingEffort]
            - required: [doneWhen]
            - required: [checks]
            - required: [sendBackOnce]
            - required: [sendBack]
            - required: [allow]
            - required: [turnedOff]
            - required: [spend]
            - required: [from]
    properties:
      id:
        $ref: "#/$defs/Identifier"
      kind:
        description: >-
          `harness` (the default, and what every team file written before review stops is) or
          `operator`. An operator node may sit anywhere in a pipeline except as the entrypoint —
          the Prompt node is already the operator at the head of a run — and team mode has none,
          both of which the loader enforces.
        type: string
        enum:
          - harness
          - operator
        default: harness
      name:
        type: string
        minLength: 1
      role:
        description: >-
          What this node is for. For a harness node it is the agent's assigned role; for an
          operator node it is the question the person at the keyboard is shown at the stop.
        type: string
        minLength: 1
      spawn:
        $ref: "#/$defs/Spawn"
      model:
        description: >-
          The model the agent runs on, and how it is paid (ADR 0073): `chatgpt:<slug>` on the
          operator's ChatGPT plan, such as `chatgpt:gpt-6.1-sol`; `anthropic:<model id>` on their
          Claude API credit, such as `anthropic:claude-opus-5-5`; or an OpenRouter model id, such as
          `anthropic/claude-opus-5.5`. Names an earlier LoomWatch wrote for an AI app (`sonnet`,
          `gpt-5.5`) are read as the matching OpenRouter model.
        type: string
        minLength: 1
      followsSuggestion:
        description: >-
          True when `model` follows the model the app suggests for this agent (ADR 0072): when its
          configuration changes, the app moves `model` to the new suggestion, and onto a plan
          connected since that offers its model, never onto OpenRouter by itself. Picking another
          model takes it out. A run always uses `model`; the daemon does not read this.
        type: boolean
      thinkingEffort:
        description: >-
          How hard the model reasons: none, minimal, low, medium, high, xhigh or max. Absent uses
          the model's own default.
        type: string
        minLength: 1
      doneWhen:
        description: >-
          What the finished result must satisfy (ADR 0062): a few short statements the agent checks
          its result against before it replies, each checkable from the result alone. The agent
          fixes what it can and lists any it could not meet under `## Not met`.
          Short on purpose: an agent follows every requirement it is given, needed or not.
        type: array
        maxItems: 5
        items:
          type: string
          minLength: 1
          maxLength: 160
      checks:
        description: >-
          Makes this agent a check step (ADR 0062): the id of the agent whose work it checks, which
          must hand its work straight to this one. It is handed that work as written and its
          `doneWhen`, and replies with a `## Check` block (Met, Not met or Not sure per item, with
          evidence). When it is the last stage and no `responder` is set, the checked agent's reply
          stays the team's answer.
        $ref: "#/$defs/Identifier"
      sendBackOnce:
        description: >-
          The older way to say `sendBack: {rounds: 1, whenStillNotMet: answer}`, still read: with
          `checks`, when a check is not met, send the findings back to the checked agent once,
          check its revised work once more, and show the answer. Write `sendBack` instead; a file
          may not set both.
        type: boolean
        default: false
      sendBack:
        description: >-
          With `checks`: when a check is not Met (Not met or Not sure), send the findings back to
          the checked agent's open session and check its revised work again, up to `rounds` times.
          It stops early when every check is met, or when a round meets none of what it went back
          for. `whenStillNotMet` says what happens when checks are still not met after that:
          `answer` shows the answer with them marked, `ask` stops the run on a review of the work,
          with the checks beside it, until the person approves it or sends it back. A scheduled run
          waits for them too. Nothing is sent back unless set.
        type: object
        additionalProperties: false
        properties:
          rounds:
            description: How many times the work may go back. Each round helps less than the one before.
            type: integer
            minimum: 1
            maximum: 3
            default: 1
          whenStillNotMet:
            enum: [answer, ask]
            default: answer
      budget:
        $ref: "#/$defs/RetiredBudget"
      spend:
        description: >-
          This agent's own guard on what one run may spend on it, in US dollars (ADR 0068): it
          stops an agent that runs away, as the team's figure stops the run. When the agent
          reaches it, it waits and the operator chooses to add money or to stop this agent; the
          rest of the team carries on. No guard unless set.
        $ref: "#/$defs/Spend"
      allowRecruiting:
        description: Whether this agent may recruit helpers while executing its own step.
        type: boolean
        default: true
      capabilities:
        description: >-
          Capabilities this agent may use. Before the run the daemon delivers each one: a skill
          into the agent's workspace as required reading, and a knowledge source into the prompt
          with a read grant for its folder or file. A `tool` from an AI app's own settings is not
          delivered: the agent is told it is unavailable and the run carries on. A skill or
          knowledge source the daemon cannot deliver fails the run rather than silently doing
          nothing.
        type: array
        default: []
        items:
          $ref: "#/$defs/Capability"
      memory:
        description: >-
          Per-agent memory overrides. Absent means the team's `memory:` block applies unchanged.
        $ref: "#/$defs/AgentMemory"
      allow:
        description: >-
          What this agent may do without asking (ADR 0037). LoomWatch answers every permission
          request itself: it approves the Team Bus, the knowledge connected to this agent, and what
          is switched on here. Anything else waits for the operator's answer on a card (ADR
          0040), or is declined in a scheduled run. Absent means everything here is off.
        type: object
        additionalProperties: false
        properties:
          web:
            description: Search the web and read web pages.
            type: boolean
            default: false
          edits:
            description: >-
              Create and change files inside the agent's own working folder, never in its
              `.agents`, `.claude`, `.git` or `.loomwatch` folders. An agent whose folder holds its
              team file always works in a folder of its own, allowed or not.
            type: boolean
            default: false
          commands:
            description: Run commands in a terminal. A command can do anything the operator can.
            type: boolean
            default: false
      turnedOff:
        description: >-
          Skills and tools this agent's own app has that the operator turned off for it, by taking
          them off the canvas (ADR 0060). Everything else the app has stays the agent's to choose.
          A skill or tool wired to the agent in `capabilities` is never turned off by an entry of
          the same name: wiring is how a skill is shared across apps. A tool is named by its MCP
          server as the app lists it (`claude.ai Notion`). Not for an operator node.
        type: array
        default: []
        items:
          type: object
          additionalProperties: false
          required:
            - kind
            - name
          properties:
            kind:
              type: string
              enum:
                - skill
                - tool
            name:
              type: string
              minLength: 1
              not:
                const: loomwatch-team-bus
      from:
        description: >-
          The agent in "Your agents" this one was placed from (`<teams root>/.jobs/<agent>.yaml`),
          and the version it copies. The fields above are that version's, so the team runs exactly
          what it was approved with: editing the agent there makes a new version, which reaches
          this team only when the operator chooses Update here. The daemon reads only `agent`: it
          names whose lessons the agent reads and adds to, the same in every team (ADR 0078).
          Removing it makes the agent this team's own.
        type: object
        additionalProperties: false
        required:
          - agent
          - version
        properties:
          agent:
            $ref: "#/$defs/Identifier"
          version:
            type: integer
            minimum: 1
      learns:
        description: >-
          Whether the agent learns from the person's feedback on its work (ADR 0078): their words
          about a finished answer, and a check that found a Done when item not met and then met
          after the send-back. What it learns is a short list of one-sentence lessons in its
          standing instructions, each shown with where it came from and undone with one click.
          `false` turns that off: it learns nothing new and is given none of its lessons. On when
          absent. Not for an operator node.
        type: boolean
      status:
        description: Runtime-only status; team-file writers omit it and readers ignore it.
        type: string
        enum:
          - idle
          - starting
          - running
          - waiting
          - succeeded
          - failed
          - stopped
          - unavailable
        default: idle

  Capability:
    type: object
    additionalProperties: false
    required:
      - kind
      - name
    properties:
      kind:
        description: >-
          `skill` is copied into the agent's workspace and required in its prompt (ADR 0012, 0019,
          0021). `knowledge` is a folder or file the operator chose, named by `path`: its contents
          are supplied in the prompt as source material and it is a read grant for that folder or
          file (ADR 0029, 0035, 0036), or, with `notion`, a Notion page read at run start (ADR
          0050). `tool` is a tool connected in LoomWatch, by its name (ADR 0069): its actions are
          offered to the agent, and each asks the operator first unless `alwaysAllow` names it. A
          name with no connected tool (such as one from an AI app's settings, ADR 0029) is told to
          the agent as unavailable. Team memory is wired through `memory.inherits`, never as
          `knowledge`.
        type: string
        enum:
          - skill
          - knowledge
          - tool
      name:
        description: >-
          The capability's name as the Library reports it. For knowledge, only the label of its
          `path` or the title of its Notion page.
        type: string
        minLength: 1
      path:
        description: >-
          Knowledge only, and required for it unless it names a Notion page (ADR 0035, 0036, 0050):
          the folder or file the operator chose. A folder is linked where it is; an added file is copied beside the team file under
          `<team>.files/` and named relative to the team file's directory. Knowledge without a path
          fails the run, because the Library no longer lists folders a name could point at.
        type: string
        minLength: 1
      notion:
        description: >-
          Knowledge only, instead of `path` (ADR 0050): a Notion page the operator chose. `name` is
          then the page's title as it was when chosen. The run reads the page through the
          operator's own Notion connection once, before anything spawns, and supplies its text
          like an added file's; the agent never holds the connection.
        type: object
        additionalProperties: false
        required:
          - page
        properties:
          page:
            description: The Notion page id.
            type: string
            pattern: "^[0-9a-fA-F]{8}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{12}$"
      alwaysAllow:
        description: >-
          Tool only (ADR 0069): the actions of this tool the agent may take without asking, by the
          tool's own name for each (`create_issue`). Every other action asks the operator first,
          and on a schedule, with nobody to ask, is declined.
        type: array
        maxItems: 200
        items:
          type: string
          minLength: 1
          maxLength: 128
    allOf:
      - if:
          required:
            - alwaysAllow
        then:
          properties:
            kind:
              const: tool
      - if:
          required:
            - path
        then:
          properties:
            kind:
              const: knowledge
      - if:
          required:
            - notion
        then:
          properties:
            kind:
              const: knowledge
          not:
            required:
              - path

  Edge:
    type: object
    additionalProperties: false
    required:
      - from
      - to
      - layer
      - kind
      - ts
    properties:
      from:
        $ref: "#/$defs/Identifier"
      to:
        $ref: "#/$defs/Identifier"
      layer:
        type: string
        enum:
          - configured
          - observed
      kind:
        type: string
        enum:
          - sequence
          - dispatch
          - ask
          - handoff
      ts:
        description: RFC 3339 timestamp for edge creation or observation.
        type: string
        format: date-time
        pattern: "^\\d{4}-\\d{2}-\\d{2}[Tt]\\d{2}:\\d{2}:\\d{2}(\\.\\d+)?([Zz]|[+-]\\d{2}:\\d{2})$"
    allOf:
      - if:
          properties:
            layer:
              const: configured
          required:
            - layer
        then:
          properties:
            kind:
              const: sequence
      - if:
          properties:
            layer:
              const: observed
          required:
            - layer
        then:
          properties:
            kind:
              enum:
                - dispatch
                - ask
                - handoff

  RunEvent:
    type: object
    additionalProperties: false
    required:
      - id
      - sessionId
      - agentId
      - seq
      - ts
      - kind
      - payload
    properties:
      id:
        description: >-
          Event identifier minted by LoomWatch. ACP session/update notifications do not
          carry event IDs of their own.
        $ref: "#/$defs/OpaqueId"
      sessionId:
        description: ACP session ID minted by the harness.
        $ref: "#/$defs/OpaqueId"
      agentId:
        $ref: "#/$defs/Identifier"
      seq:
        description: Dense per-session replay counter assigned on receipt, starting at zero.
        type: integer
        minimum: 0
      ts:
        description: >-
          RFC 3339 client-receipt time. ACP carries no agent-side timestamp, so this is
          when LoomWatch observed the event.
        type: string
        format: date-time
        pattern: "^\\d{4}-\\d{2}-\\d{2}[Tt]\\d{2}:\\d{2}:\\d{2}(\\.\\d+)?([Zz]|[+-]\\d{2}:\\d{2})$"
      kind:
        description: Normalized routing hint; raw preserves the complete ACP frame.
        type: string
        enum:
          - message
          - thought
          - tool_call
          - tool_update
          - plan
          - permission
          - session_meta
          - usage
          - turn_end
          - process
      payload:
        description: Kind-specific projection for indexing and rendering.
        type: object
      raw:
        description: >-
          Originating JSON-RPC frame preserved verbatim. Required for ACP-sourced events
          and omitted only for LoomWatch-local process events.
        type: object
    allOf:
      - if:
          properties:
            kind:
              const: message
          required:
            - kind
        then:
          properties:
            payload:
              $ref: "#/$defs/MessagePayload"
          required:
            - raw
      - if:
          properties:
            kind:
              const: thought
          required:
            - kind
        then:
          properties:
            payload:
              $ref: "#/$defs/MessagePayload"
          required:
            - raw
      - if:
          properties:
            kind:
              const: tool_call
          required:
            - kind
        then:
          properties:
            payload:
              $ref: "#/$defs/ToolCallPayload"
          required:
            - raw
      - if:
          properties:
            kind:
              const: tool_update
          required:
            - kind
        then:
          properties:
            payload:
              $ref: "#/$defs/ToolUpdatePayload"
          required:
            - raw
      - if:
          properties:
            kind:
              const: turn_end
          required:
            - kind
        then:
          properties:
            payload:
              $ref: "#/$defs/TurnEndPayload"
          required:
            - raw
      - if:
          properties:
            kind:
              const: usage
          required:
            - kind
        then:
          properties:
            payload:
              $ref: "#/$defs/UsagePayload"
      - if:
          properties:
            kind:
              const: process
          required:
            - kind
        then:
          properties:
            payload:
              $ref: "#/$defs/ProcessPayload"
        else:
          required:
            - raw

  MessagePayload:
    type: object
    additionalProperties: false
    required:
      - role
      - content
    properties:
      role:
        description: Origin of this content chunk in the normalized transcript.
        type: string
        enum:
          - user
          - agent
          - thought
      messageId:
        description: ACP message identifier shared by chunks in one message.
        anyOf:
          - $ref: "#/$defs/OpaqueId"
          - type: "null"
      content:
        description: ACP ContentBlock preserved as structured JSON.
        type: object

  ToolCallPayload:
    type: object
    additionalProperties: false
    required:
      - callId
      - title
    properties:
      callId:
        $ref: "#/$defs/OpaqueId"
      title:
        type: string
      name:
        type:
          - string
          - "null"
      toolKind:
        $ref: "#/$defs/ToolCallKind"
      status:
        $ref: "#/$defs/ToolCallStatus"
      rawInput: {}
      rawOutput: {}
      content:
        type: array
        items:
          type: object
      locations:
        type: array
        items:
          type: object

  ToolUpdatePayload:
    type: object
    additionalProperties: false
    required:
      - callId
    properties:
      callId:
        $ref: "#/$defs/OpaqueId"
      title:
        type:
          - string
          - "null"
      name:
        type:
          - string
          - "null"
      toolKind:
        $ref: "#/$defs/ToolCallKind"
      status:
        $ref: "#/$defs/ToolCallStatus"
      rawInput: {}
      rawOutput: {}
      content:
        type:
          - array
          - "null"
        items:
          type: object
      locations:
        type:
          - array
          - "null"
        items:
          type: object

  ToolCallKind:
    type: string
    enum:
      - read
      - edit
      - delete
      - move
      - search
      - execute
      - think
      - fetch
      - switch_mode
      - other

  ToolCallStatus:
    type: string
    enum:
      - pending
      - in_progress
      - completed
      - failed

  TurnEndPayload:
    type: object
    additionalProperties: false
    required:
      - stopReason
    properties:
      stopReason:
        type: string
        enum:
          - end_turn
          - max_tokens
          - max_turn_requests
          - refusal
          - cancelled
          - spend_limit
      usage:
        type: object

  UsagePayload:
    description: >-
      Either a harness-reported usage update or a LoomWatch-local control-plane
      event, discriminated structurally. Harness updates carry sessionUpdate
      (the ACP update archived verbatim). A bare spend delta carries only
      costUsd. LoomWatch reads neither as spend: budgets were retired by
      ADR 0027, and these are kept as evidence only.
    type: object
    anyOf:
      - description: ACP usage_update, archived verbatim.
        type: object
        properties:
          sessionUpdate:
            const: usage_update
        required:
          - sessionUpdate
      - description: Bare harness-supplied spend delta, archived as evidence.
        type: object
        properties:
          costUsd:
            type: number
            minimum: 0
        required:
          - costUsd
      - description: >-
          Retired budget warning. LoomWatch stopped writing it with ADR 0027; runs archived before
          then still contain it, so it stays valid here.
        type: object
        additionalProperties: false
        properties:
          phase:
            const: budget_warning
          scope:
            description: Budget scope - team, or agent:<id> for the delegation target.
            type: string
            minLength: 1
          spentUsd:
            type: number
            minimum: 0
          limitUsd:
            type: number
            minimum: 0
          warnAtPercent:
            type: integer
            minimum: 1
            maximum: 100
        required:
          - phase
          - scope
          - spentUsd
          - limitUsd
          - warnAtPercent

  ProcessPayload:
    type: object
    additionalProperties: false
    required:
      - phase
    properties:
      phase:
        type: string
        enum:
          - spawned
          - exited
          - crashed
          - stderr
      pid:
        type: integer
        minimum: 0
      cwd:
        description: >-
          On `spawned`: the folder the agent works in, by its full path, so a file its answer names
          from there can be found. `null` when that path is not UTF-8; absent in older runs.
        type:
          - string
          - "null"
      exitCode:
        type:
          - integer
          - "null"
      signal:
        type:
          - string
          - "null"
      message:
        type: string
