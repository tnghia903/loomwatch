$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://loomwatch.dev/schemas/team.schema.yaml"
title: LoomWatch team configuration
description: >-
  Versioned source-of-truth configuration for one LoomWatch team. Runtime-only
  records use the reusable Edge and RunEvent definitions under $defs.
type: object
additionalProperties: false
required:
  - schemaVersion
  - id
  - name
  - entrypoint
  - agents
  - edges
properties:
  schemaVersion:
    description: Major schema version. Unknown versions must be rejected.
    const: 1
  id:
    $ref: "#/$defs/Identifier"
  name:
    type: string
    minLength: 1
  budget:
    description: Team-wide ceiling for one run, enforced in addition to agent budgets.
    $ref: "#/$defs/Budget"
  guards:
    description: Server-enforced limits for delegation through the Team Bus.
    $ref: "#/$defs/Guards"
  entrypoint:
    description: Agent that receives the initial goal in team or pipeline mode.
    $ref: "#/$defs/Identifier"
  agents:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/Agent"
  edges:
    description: User-configured pipeline edges. Observed edges are runtime data.
    type: array
    items:
      allOf:
        - $ref: "#/$defs/Edge"
        - type: object
          properties:
            layer:
              const: configured
            kind:
              const: sequence

$defs:
  Identifier:
    type: string
    minLength: 1
    maxLength: 128
    pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"

  OpaqueId:
    description: Opaque identifier stored verbatim and never parsed.
    type: string
    minLength: 1
    maxLength: 512

  Spawn:
    type: object
    additionalProperties: false
    required:
      - cmd
      - args
      - env
      - cwd
    properties:
      cmd:
        description: >-
          Bare executable name resolved on PATH, or an absolute path. It is never
          interpreted by a shell.
        type: string
        minLength: 1
        pattern: '^(/[^\x00]*|[A-Za-z0-9._-]+)$'
      args:
        type: array
        items:
          type: string
      env:
        description: Environment additions passed to the child process; no secrets are stored here.
        type: object
        propertyNames:
          pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        additionalProperties:
          type: string
      cwd:
        description: Absolute path or path relative to the team file.
        type: string
        minLength: 1

  Budget:
    type: object
    additionalProperties: false
    required:
      - limitUsd
    properties:
      limitUsd:
        description: Hard maximum estimated spend in US dollars for one run.
        type: number
        minimum: 0
      warnAtPercent:
        description: Percentage of limitUsd at which LoomWatch emits a warning.
        type: integer
        minimum: 1
        maximum: 100
        default: 80

  Guards:
    type: object
    additionalProperties: false
    properties:
      maxDispatchDepth:
        description: Maximum Team Bus dispatch depth before further dispatches are refused.
        type: integer
        minimum: 0
        default: 8

  Agent:
    type: object
    additionalProperties: false
    required:
      - id
      - name
      - role
      - spawn
      - model
      - budget
    properties:
      id:
        $ref: "#/$defs/Identifier"
      name:
        type: string
        minLength: 1
      role:
        type: string
        minLength: 1
      spawn:
        $ref: "#/$defs/Spawn"
      model:
        description: Harness-specific model selector.
        type: string
        minLength: 1
      budget:
        $ref: "#/$defs/Budget"
      allowRecruiting:
        description: Whether this agent may recruit helpers while executing its own step.
        type: boolean
        default: true
      status:
        description: Runtime-only status; team-file writers omit it and readers ignore it.
        type: string
        enum:
          - idle
          - starting
          - running
          - waiting
          - succeeded
          - failed
          - stopped
          - unavailable
        default: idle

  Edge:
    type: object
    additionalProperties: false
    required:
      - from
      - to
      - layer
      - kind
      - ts
    properties:
      from:
        $ref: "#/$defs/Identifier"
      to:
        $ref: "#/$defs/Identifier"
      layer:
        type: string
        enum:
          - configured
          - observed
      kind:
        type: string
        enum:
          - sequence
          - dispatch
          - ask
          - handoff
      ts:
        description: RFC 3339 timestamp for edge creation or observation.
        type: string
        format: date-time
        pattern: "^\\d{4}-\\d{2}-\\d{2}[Tt]\\d{2}:\\d{2}:\\d{2}(\\.\\d+)?([Zz]|[+-]\\d{2}:\\d{2})$"
    allOf:
      - if:
          properties:
            layer:
              const: configured
          required:
            - layer
        then:
          properties:
            kind:
              const: sequence
      - if:
          properties:
            layer:
              const: observed
          required:
            - layer
        then:
          properties:
            kind:
              enum:
                - dispatch
                - ask
                - handoff

  RunEvent:
    type: object
    additionalProperties: false
    required:
      - id
      - sessionId
      - agentId
      - seq
      - ts
      - kind
      - payload
    properties:
      id:
        description: >-
          Event identifier minted by LoomWatch. ACP session/update notifications do not
          carry event IDs of their own.
        $ref: "#/$defs/OpaqueId"
      sessionId:
        description: ACP session ID minted by the harness.
        $ref: "#/$defs/OpaqueId"
      agentId:
        $ref: "#/$defs/Identifier"
      seq:
        description: Dense per-session replay counter assigned on receipt, starting at zero.
        type: integer
        minimum: 0
      ts:
        description: >-
          RFC 3339 client-receipt time. ACP carries no agent-side timestamp, so this is
          when LoomWatch observed the event.
        type: string
        format: date-time
        pattern: "^\\d{4}-\\d{2}-\\d{2}[Tt]\\d{2}:\\d{2}:\\d{2}(\\.\\d+)?([Zz]|[+-]\\d{2}:\\d{2})$"
      kind:
        description: Normalized routing hint; raw preserves the complete ACP frame.
        type: string
        enum:
          - message
          - thought
          - tool_call
          - tool_update
          - plan
          - permission
          - session_meta
          - usage
          - turn_end
          - process
      payload:
        description: Kind-specific projection for indexing and rendering.
        type: object
      raw:
        description: >-
          Originating JSON-RPC frame preserved verbatim. Required for ACP-sourced events
          and omitted only for LoomWatch-local process events.
        type: object
    allOf:
      - if:
          properties:
            kind:
              const: message
          required:
            - kind
        then:
          properties:
            payload:
              $ref: "#/$defs/MessagePayload"
          required:
            - raw
      - if:
          properties:
            kind:
              const: thought
          required:
            - kind
        then:
          properties:
            payload:
              $ref: "#/$defs/MessagePayload"
          required:
            - raw
      - if:
          properties:
            kind:
              const: tool_call
          required:
            - kind
        then:
          properties:
            payload:
              $ref: "#/$defs/ToolCallPayload"
          required:
            - raw
      - if:
          properties:
            kind:
              const: tool_update
          required:
            - kind
        then:
          properties:
            payload:
              $ref: "#/$defs/ToolUpdatePayload"
          required:
            - raw
      - if:
          properties:
            kind:
              const: turn_end
          required:
            - kind
        then:
          properties:
            payload:
              $ref: "#/$defs/TurnEndPayload"
          required:
            - raw
      - if:
          properties:
            kind:
              const: process
          required:
            - kind
        then:
          properties:
            payload:
              $ref: "#/$defs/ProcessPayload"
        else:
          required:
            - raw

  MessagePayload:
    type: object
    additionalProperties: false
    required:
      - role
      - content
    properties:
      role:
        description: Origin of this content chunk in the normalized transcript.
        type: string
        enum:
          - user
          - agent
          - thought
      messageId:
        description: ACP message identifier shared by chunks in one message.
        anyOf:
          - $ref: "#/$defs/OpaqueId"
          - type: "null"
      content:
        description: ACP ContentBlock preserved as structured JSON.
        type: object

  ToolCallPayload:
    type: object
    additionalProperties: false
    required:
      - callId
      - title
    properties:
      callId:
        $ref: "#/$defs/OpaqueId"
      title:
        type: string
      name:
        type:
          - string
          - "null"
      toolKind:
        $ref: "#/$defs/ToolCallKind"
      status:
        $ref: "#/$defs/ToolCallStatus"
      rawInput: {}
      rawOutput: {}
      content:
        type: array
        items:
          type: object
      locations:
        type: array
        items:
          type: object

  ToolUpdatePayload:
    type: object
    additionalProperties: false
    required:
      - callId
    properties:
      callId:
        $ref: "#/$defs/OpaqueId"
      title:
        type:
          - string
          - "null"
      name:
        type:
          - string
          - "null"
      toolKind:
        $ref: "#/$defs/ToolCallKind"
      status:
        $ref: "#/$defs/ToolCallStatus"
      rawInput: {}
      rawOutput: {}
      content:
        type:
          - array
          - "null"
        items:
          type: object
      locations:
        type:
          - array
          - "null"
        items:
          type: object

  ToolCallKind:
    type: string
    enum:
      - read
      - edit
      - delete
      - move
      - search
      - execute
      - think
      - fetch
      - switch_mode
      - other

  ToolCallStatus:
    type: string
    enum:
      - pending
      - in_progress
      - completed
      - failed

  TurnEndPayload:
    type: object
    additionalProperties: false
    required:
      - stopReason
    properties:
      stopReason:
        type: string
        enum:
          - end_turn
          - max_tokens
          - max_turn_requests
          - refusal
          - cancelled
      usage:
        type: object

  ProcessPayload:
    type: object
    additionalProperties: false
    required:
      - phase
    properties:
      phase:
        type: string
        enum:
          - spawned
          - exited
          - crashed
          - stderr
      pid:
        type: integer
        minimum: 0
      exitCode:
        type:
          - integer
          - "null"
      signal:
        type:
          - string
          - "null"
      message:
        type: string
