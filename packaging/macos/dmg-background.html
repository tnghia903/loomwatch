<!doctype html>
<!--
  The picture behind the window people see when they open LoomWatch-macos.dmg. make-dmg-background.sh
  draws it to dmg/background.png (and @2x) with headless Chrome; add ?notarized for the copy without
  the "Open Anyway" note, which a notarized app never needs.

  The window is 720 × 480 points under its title bar. Finder puts each icon's centre where
  dmg-settings.py says (LoomWatch at 170, 200 and Applications at 550, 200, at 128 px) and its name
  about 83 points below that, so the patches and name tags here are drawn around those points; move
  them together. The picture is 20 points taller than the window, for a macOS whose title bar is
  shorter, and the last 28 points may sit under Finder's path bar (the crew at the bottom peek out
  from behind it).

  Finder picks the names' colour itself, not from this picture (black over it on macOS 27 even in
  dark mode, white over no picture), so each name sits on a gold-700 tag that black and white both
  read on at about 4.5 : 1.

  The crew round the edges are dmg/crew/wave-*.webp: `Blender -b --factory-startup -P
  ui/blender/workbench.py -- wave DIR 128` (the figures' Blender script, which is kept out of git),
  each render cropped to 213,196–747,788 and saved with `cwebp -q 88 -m 6 -alpha_filter best`.
-->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../ui/public/fonts/fonts.css">
<style>
  :root {
    --ground: #121110;
    --patch: #1B1916;
    --bone: #F5F3EE;
    --ink-2: #A9A59C;
    --ink-3: #85817A;
    --gold-200: #E9C46A;
    --gold-400: #D8A93C;
    --gold-700: #8C7130;
  }
  html, body { margin: 0; }
  body {
    width: 720px;
    height: 500px;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse 300px 190px at 170px 205px, rgb(216 169 60 / 0.13), transparent 70%),
      radial-gradient(ellipse 520px 260px at 360px 500px, rgb(216 169 60 / 0.07), transparent 70%),
      var(--ground);
    font-family: "Inter", -apple-system, sans-serif;
    color: var(--bone);
    -webkit-font-smoothing: antialiased;
  }
  /* A faint weave, the cloth everything is sewn onto. */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(0deg, rgb(255 255 255 / 0.018) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgb(255 255 255 / 0.014) 0 1px, transparent 1px 3px);
  }
  h1 {
    position: absolute;
    top: 30px;
    left: 0;
    right: 0;
    margin: 0;
    text-align: center;
    font: 400 29px/1.1 "Fraunces", Georgia, serif;
    letter-spacing: -0.01em;
  }
  h1 em { font-style: italic; color: var(--gold-200); }
  .lede {
    position: absolute;
    top: 72px;
    left: 0;
    right: 0;
    margin: 0;
    text-align: center;
    font-size: 13px;
    line-height: 18px;
    color: var(--ink-2);
  }
  svg.art { position: absolute; left: 0; top: 0; }
  /* The crew, peeking in round the edges and waving hello. Each picture is one render from
     ui/blender/workbench.py's wave mode, cropped to one box (534 × 592, the seat at the bottom), so
     one width sizes them all alike; they turn about the seat. */
  .pal {
    position: absolute;
    width: 100px;
    transform-origin: 50% 98%;
  }
  .bubble {
    position: absolute;
    padding: 3px 10px 4px;
    border-radius: 12px;
    background: var(--bone);
    color: #17150F;
    font: italic 400 15px/1 "Fraunces", Georgia, serif;
  }
  .bubble::after {
    content: "";
    position: absolute;
    bottom: -5px;
    width: 10px;
    height: 10px;
    background: inherit;
    border-radius: 0 0 3px 0;
    transform: rotate(45deg);
  }
  .bubble::after { left: 12px; }
  .note {
    position: absolute;
    top: 414px;
    left: 0;
    right: 0;
    margin: 0;
    text-align: center;
    font-size: 11.5px;
    line-height: 16px;
    color: var(--ink-3);
  }
  .note b { font-weight: 600; color: var(--ink-2); }
  .notarized .note { display: none; }
</style>
</head>
<body>
<script>
  if (location.search.includes("notarized")) document.body.classList.add("notarized");
</script>

<h1>Drag LoomWatch into <em>Applications</em></h1>
<p class="lede">Then open it from Applications. It starts in your browser and waits in your menu bar.</p>

<svg class="art" width="720" height="500" viewBox="0 0 720 500" aria-hidden="true">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F3EE"/>
      <stop offset="1" stop-color="#A9A59C"/>
    </linearGradient>
  </defs>

  <!-- The two patches the icons sit on. LoomWatch's is sewn in gold; Applications' waits in bone. -->
  <rect x="82" y="112" width="176" height="176" rx="40" fill="#1B1916"/>
  <rect x="88" y="118" width="164" height="164" rx="34" fill="none" stroke="#D8A93C" stroke-width="2.5"
        stroke-linecap="round" stroke-dasharray="7 8"/>
  <rect x="462" y="112" width="176" height="176" rx="40" fill="#1B1916"/>
  <rect x="468" y="118" width="164" height="164" rx="34" fill="none" stroke="#F5F3EE" stroke-opacity="0.32"
        stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 8"/>

  <!-- The thread from LoomWatch's patch, through the needle's eye, into Applications. -->
  <path d="M264 200C298 136 348 200 392 200" fill="none" stroke="#D8A93C" stroke-width="3"
        stroke-linecap="round" stroke-dasharray="9 7"/>
  <g transform="translate(390 200)">
    <path d="M0 -3.8C0 -5.2 1.2 -5.8 2.4 -5.8L52 -1.5Q66 0 52 1.5L2.4 5.8C1.2 5.8 0 5.2 0 3.8Z"
          fill="url(#steel)"/>
    <rect x="4.5" y="-1.4" width="13" height="2.8" rx="1.4" fill="#121110"/>
  </g>

  <!-- Name tags, sewn on across each patch's lower edge; Finder writes the name on them. -->
  <g fill="#8C7130">
    <rect x="110" y="271" width="120" height="24" rx="4"/>
    <rect x="490" y="271" width="120" height="24" rx="4"/>
  </g>
  <g stroke="#E9C46A" stroke-opacity="0.75" stroke-width="1.6" stroke-linecap="round">
    <path d="M116 276V290M224 276V290M496 276V290M604 276V290"/>
  </g>
</svg>

<img class="pal" src="dmg/crew/wave-button-l.webp" alt="" style="left: -32px; top: 150px; transform: rotate(10deg)">
<img class="pal" src="dmg/crew/wave-yarn-r.webp" alt="" style="left: 14px; top: 366px; transform: rotate(6deg)">
<img class="pal" src="dmg/crew/wave-spool-l.webp" alt="" style="left: 96px; top: 382px; transform: rotate(-4deg)">
<img class="pal" src="dmg/crew/wave-pincushion-r.webp" alt="" style="left: 524px; top: 382px; transform: rotate(4deg)">
<img class="pal" src="dmg/crew/wave-cone-l.webp" alt="" style="left: 606px; top: 366px; transform: rotate(-6deg)">
<img class="pal" src="dmg/crew/wave-thimble-r.webp" alt="" style="left: 652px; top: 150px; transform: rotate(-10deg)">
<span class="bubble" style="left: 56px; top: 340px">hi!</span>
<span class="bubble" style="left: 556px; top: 352px">hello!</span>

<p class="note">If macOS blocks the first open, click <b>Done</b>,<br>then <b>Open Anyway</b> in System Settings › Privacy &amp; Security.</p>
</body>
</html>
